[package]
name = "pygame_spine"
version = "0.2.0"
edition = "2021"
description = "pygamest 生态 Spine 2D 骨骼动画适配层——chine v0.2.0 vendored（MIT，Oneiriq/chine 溯源）+ 适配面（demo 构造器）"
license = "MIT"

[features]
json = ["dep:serde_json"]
binary = []
default = ["json", "binary"]

[dependencies]
glam = "0.33"
serde_json = { version = "1", optional = true }
